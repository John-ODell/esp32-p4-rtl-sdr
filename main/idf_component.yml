## Wi-Fi and BLE come from the kit's ESP32-C6 over SDIO (ESP-Hosted). Versions match
## Waveshare's 10_wifistation example for IDF 5.x, which suits the C6's factory firmware.
dependencies:
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  ## ES8311 speaker codec on the kit (I2C 0x18, I2S, NS4150B amplifier on GPIO53)
  espressif/esp_codec_dev: "1.6.*"
